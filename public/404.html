<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauge House — Precision Industrial Gauges & Equipment</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      // Redirects 404s back to the base of the app with the route stored in the hash
      (function () {
        var l = window.location;
        var path = l.pathname || '';
        var segments = path.split('/').filter(Boolean);
        
        var base = '/';
        var appRoute = path;
        
        // On *.github.io, project pages are hosted at /repo-name/
        if (l.hostname.indexOf('github.io') !== -1 && segments.length > 0) {
          base = '/' + segments[0] + '/';
          appRoute = '/' + segments.slice(1).join('/');
        } else if (path.startsWith('/gauge-house-webapp/')) {
          base = '/gauge-house-webapp/';
          appRoute = '/' + segments.slice(1).join('/');
        }
        
        if (!appRoute.startsWith('/')) {
          appRoute = '/' + appRoute;
        }
        
        var search = l.search || '';
        var hash = l.hash || '';
        var newUrl = l.protocol + '//' + l.host + base + '#' + appRoute + search + hash;
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
