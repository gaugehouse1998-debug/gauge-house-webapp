<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauge House — Precision Industrial Gauges & Equipment</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      // Redirects 404s back to the root of the app with the route in the hash
      (function () {
        var base = '/gauge-house-webapp/';
        var path = window.location.pathname;
        if (path.startsWith(base)) {
          path = path.slice(base.length - 1);
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var newUrl = base + '#' + path + search + hash;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
