<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauge House — Precision Industrial Gauges & Equipment</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      // Redirects 404s back to the base of the app with the route stored in the hash
      (function () {
        var l = window.location;
        var path = l.pathname || '';
        var segments = path.split('/').filter(Boolean);
        
        var base = '/';
        var appRoute = path;
        
        // On *.github.io, project pages are hosted at /repo-name/
        if (l.hostname.indexOf('github.io') !== -1 && segments.length > 0) {
          base = '/' + segments[0] + '/';
          appRoute = '/' + segments.slice(1).join('/');
        } else if (path.startsWith('/gauge-house-webapp/')) {
          base = '/gauge-house-webapp/';
          appRoute = '/' + segments.slice(1).join('/');
        }
        
        // Clean multiple slashes and construct hash route
        appRoute = '/' + appRoute.replace(/^\/+/, '');
        
        var search = l.search || '';
        var hash = l.hash || '';
        var newUrl = l.protocol + '//' + l.host + base + (appRoute === '/' ? '' : '#' + appRoute) + search + hash;
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0a0a; color: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
    <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: #ffffff;">Gauge House</h1>
    <p style="font-size: 13px; color: #a3a3a3; margin: 0 0 16px;">Redirecting to catalog...</p>
    <a href="./" style="display: inline-block; padding: 10px 20px; border-radius: 8px; background-color: #ea580c; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: bold;">
      Click here if not redirected
    </a>
  </body>
</html>
